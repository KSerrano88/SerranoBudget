name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bulk_test
          POSTGRES_PASSWORD: bulk_test
          POSTGRES_DB: bulk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bulk_test -d bulk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bulk_test:bulk_test@localhost:5432/bulk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
